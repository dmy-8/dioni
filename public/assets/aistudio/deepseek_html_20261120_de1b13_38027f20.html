    if(!a.paused){a.pause();a.removeAttribute('src');a.load();set('off','Pausado');return}
    set('load','Conectando…');a.src=STREAM+'?t='+Date.now();a.volume=vol.value;
    var p=a.play();if(p)p.catch(function(){set('off','No se pudo conectar. Reintenta.')});
  };
  a.addEventListener('playing',function(){set('on','Sonando en vivo')});
  a.addEventListener('waiting',function(){set('load','Cargando…')});
  a.addEventListener('error',function(){if(a.getAttribute('src'))set('off','Error en la emisión. Reintenta.')});
  function vIcon(){vi.setAttribute('d',a.muted||a.volume==0?VOFF:VON)}
  vol.oninput=function(){a.volume=vol.value;a.muted=false;vIcon()};
  mu.onclick=function(){a.muted=!a.muted;vIcon()};
})();
</script>
